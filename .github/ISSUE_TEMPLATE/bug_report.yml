name: Bug report
description: Reportar un comportamiento inesperado o un error reproducible.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. No incluyas secretos, claves de Supabase ni datos reales de clientes.
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: ¿Qué pasó y qué esperabas que pasara?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a ...
        2. Hacer clic en ...
        3. Ver el error ...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Entorno
      options:
        - Modo demo local
        - Supabase local
        - Supabase remoto
        - Producción
        - No estoy seguro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
      description: Hash, tag o rama.
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Pegá solo la parte relevante y quitá cualquier credencial.
      render: shell
